[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-car-evaluation"
version = "0.1.0"
description = "Automated multi-turn car-buying evaluation for two LLM models"
requires-python = ">=3.8"

[project.scripts]
llm-eval-smoke = "llm_eval.smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

